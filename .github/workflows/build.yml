name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          df -h /

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 \
            cmake libffi-dev libssl-dev lldb libsqlite3-dev

      - name: Install Python Dependencies & Cython
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade setuptools wheel
          pip install Cython==0.29.36 virtualenv buildozer

      - name: Build APK with Detailed Logs
        run: |
          set +e
          # استخدام log_level=2 لإظهار تفاصيل الخطأ بدقة في حال حدوثه
          buildozer -v android debug log_level=2 > build.log 2>&1
          code=$?
          echo "EXIT CODE: $code"
          df -h /
          free -h
          echo "=== ERRORS FOUND ==="
          grep -n -i -E "error:|Error [0-9]|fatal error|No space|Killed|Traceback|FAILED" build.log | tail -n 35
          echo "=== LAST 50 LINES OF BUILD LOG ==="
          tail -n 50 build.log
          exit $code

      - name: Upload APK Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: bin/*.apk
          if-no-files-found: ignore

      - name: Upload Full Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
