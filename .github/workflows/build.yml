name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          df -h /

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: 'pip'

      - name: Install System Dependencies & Compilers
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git zip unzip openjdk-17-jdk \
            autoconf automake libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 \
            cmake libffi-dev libssl-dev lldb libsqlite3-dev libltdl-dev ant

      - name: Install Python Dependencies & Cython
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade setuptools wheel
          pip install Cython==0.29.36 virtualenv buildozer

      - name: Cache Buildozer Directory
        uses: actions/cache@v4
        with:
          path: |
            .buildozer
            ~/.buildozer
          key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}-${{ hashFiles('*.py') }}
          restore-keys: |
            ${{ runner.os }}-buildozer-

      - name: Build APK with Ultimate Diagnostics
        run: |
          set +e
          buildozer -v android debug log_level=2 > build.log 2>&1
          code=$?
          echo "EXIT CODE: $code"
          
          # إذا حدث أي خطأ، سيقوم الكود بطباعة السبب الحقيقي فوراً في الشاشة لتراها بوضوح
          if [ $code -ne 0 ]; then
            echo "=== BUILD FAILED. HERE IS THE EXACT ERROR FROM BUILD.LOG ==="
            tail -n 120 build.log
          else
            echo "=== BUILD SUCCESSFUL! ==="
          fi
          
          exit $code

      - name: Upload APK Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: bin/*.apk
          if-no-files-found: ignore

      - name: Upload Full Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
